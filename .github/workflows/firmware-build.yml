name: Firmware build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native firmware and profiles
        run: tests/native/run.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host dependencies
        run: python -m pip install -r tools/host/requirements.txt
      - name: Test host with software transports only
        run: |
          python -m unittest discover -s tests/host -v
          python -m unittest discover -s tests/release -v
  uno:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full, uart, distance, temperature, buzzer, servo]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Compile Arduino Uno profile
        run: tools/build_firmware.sh "${{ matrix.profile }}"
  avr-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure simulation paths on the runner
        run: |
          echo "ARDUCORE_SIM_RUNNER=$RUNNER_TEMP/arducore-sim" >> "$GITHUB_ENV"
          echo "ARDUCORE_SIM_ELF=$RUNNER_TEMP/arducore-uno/arducore.ino.elf" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - name: Install headless simulation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev
          python -m pip install -r tools/host/requirements.txt
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Build production ELF and pinned simulator
        run: |
          tools/build_firmware.sh full --build-path "$RUNNER_TEMP/arducore-uno"
          tools/simulation/setup_simavr.sh "$RUNNER_TEMP/simavr"
          tools/simulation/build_runner.sh "$RUNNER_TEMP/simavr" "$ARDUCORE_SIM_RUNNER"
      - name: Test actual AVR instructions and virtual serial end-to-end
        run: |
          python -m unittest discover -s tests/simulation -v
          python -m unittest discover -s tests/e2e -v
      - name: Short deterministic stress check
        run: |
          python tests/simulation/soak.py --runner "$ARDUCORE_SIM_RUNNER" --elf "$ARDUCORE_SIM_ELF" --minutes 1 --report "$RUNNER_TEMP/soak.json"
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-soak
          path: ${{ runner.temp }}/soak.json
